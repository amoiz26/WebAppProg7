
<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        }

        h1 {

        }

    align-items: center;

    margin: 20px auto;
}

.game-row {
    display: flex;
    gap: 5px;
}

.game-cell {
    width: 75px;
    height: 75px;
}

.game-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: 2px solid darkgreen;
    border-radius: 5px;
}


    </style>
</head>
<body>

    <h1>Abdul Moiz finds avians</h1>

    <p class="game-info">
        Click on the locations to find the flowers,
        watch out for the poison ivy
    </p>

    <p id="locations">
        Number of locations checked is zero.
    </p>

    <p id="score">
        Score is zero.
    </p>

   <p id="helpButton" onclick="showHelp()" style="cursor:pointer;">
    Click for help.
</p>

    <p id="help">Help report</p>



<div class="game-board">

    <div class="game-row">
        <div class="game-cell"><img id="img0" src="images/bush.jpg" alt="Bush" onclick="check(0)"></div>
        <div class="game-cell"><img id="img1" src="images/bush.jpg" alt="Bush" onclick="check(1)"></div>

        <div class="game-cell"><img id="img3" src="images/bush.jpg" alt="Bush" onclick="check(3)"></div>
        <div class="game-cell"><img id="img4" src="images/bush.jpg" alt="Bush" onclick="check(4)"></div>
        <div class="game-cell"><img id="img5" src="images/bush.jpg" alt="Bush" onclick="check(5)"></div>
    </div>

    <div class="game-row">
        <div class="game-cell"><img id="img6" src="images/bush.jpg" alt="Bush" onclick="check(6)"></div>
        <div class="game-cell"><img id="img7" src="images/bush.jpg" alt="Bush" onclick="check(7)"></div>
        <div class="game-cell"><img id="img8" src="images/bush.jpg" alt="Bush" onclick="check(8)"></div>
        <div class="game-cell"><img id="img9" src="images/bush.jpg" alt="Bush" onclick="check(9)"></div>
        <div class="game-cell"><img id="img10" src="images/bush.jpg" alt="Bush" onclick="check(10)"></div>
        <div class="game-cell"><img id="img11" src="images/bush.jpg" alt="Bush" onclick="check(11)"></div>
    </div>

    <div class="game-row">
        <div class="game-cell"><img id="img12" src="images/bush.jpg" alt="Bush" onclick="check(12)"></div>
        <div class="game-cell"><img id="img13" src="images/bush.jpg" alt="Bush" onclick="check(13)"></div>
        <div class="game-cell"><img id="img14" src="images/bush.jpg" alt="Bush" onclick="check(14)"></div>
        <div class="game-cell"><img id="img15" src="images/bush.jpg" alt="Bush" onclick="check(15)"></div>
        <div class="game-cell"><img id="img16" src="images/bush.jpg" alt="Bush" onclick="check(16)"></div>
        <div class="game-cell"><img id="img17" src="images/bush.jpg" alt="Bush" onclick="check(17)"></div>

        <div class="game-cell"><img id="img20" src="images/bush.jpg" alt="Bush" onclick="check(20)"></div>
        <div class="game-cell"><img id="img21" src="images/bush.jpg" alt="Bush" onclick="check(21)"></div>

    </div>

    <div class="game-row">
        <div class="game-cell"><img id="img30" src="images/bush.jpg" alt="Bush" onclick="check(30)"></div>
        <div class="game-cell"><img id="img31" src="images/bush.jpg" alt="Bush" onclick="check(31)"></div>
        <div class="game-cell"><img id="img32" src="images/bush.jpg" alt="Bush" onclick="check(32)"></div>
        <div class="game-cell"><img id="img33" src="images/bush.jpg" alt="Bush" onclick="check(33)"></div>
        <div class="game-cell"><img id="img34" src="images/bush.jpg" alt="Bush" onclick="check(34)"></div>
        <div class="game-cell"><img id="img35" src="images/bush.jpg" alt="Bush" onclick="check(35)"></div>
    </div>

</div>



<script>
const ids = Array.from({length: 36}, (_, i) => "img" + i);

let score = 0;
let locationsVisited = 0;
let lastLocation = 0;
let gameOver = false;
let visited = new Set();

function randomPosition(excluded = []) {
    let available = Array.from({length: 36}, (_, i) => i)
        .filter(i => !excluded.includes(i));

    return available[Math.floor(Math.random() * available.length)];
}

// BONUS: Random flower and poison ivy positions
let poisonLocation = randomPosition();
let roseLocation = randomPosition([poisonLocation]);

let lilyLocations = [];
let daisyLocations = [];

for (let i = 0; i < 2; i++) {
    lilyLocations.push(randomPosition([
        poisonLocation, roseLocation,
        ...lilyLocations, ...daisyLocations
    ]));
}

for (let i = 0; i < 5; i++) {
    daisyLocations.push(randomPosition([
        poisonLocation, roseLocation,
        ...lilyLocations, ...daisyLocations
    ]));
}

function updateDisplay() {
    document.getElementById("locations").innerHTML =
        "Number of locations checked is " + locationsVisited + ".";

    document.getElementById("score").innerHTML =
        "Score is " + score + ".";
}

function endGame() {
    gameOver = true;
    document.getElementById("help").innerHTML =
        "Game Over! You found poison ivy.";
}

function check(position) {
    if (gameOver) return;

    let image = document.getElementById(ids[position]);

    if (!visited.has(position)) {
        visited.add(position);
        locationsVisited++;
        lastLocation = position;

        if (position === poisonLocation) {
            image.src = "images/poison.jpg";
            score -= 4;
            endGame();
        }
        else if (position === roseLocation) {
            image.src = "images/rose.jpg";
            score += 4;
        }
        else if (lilyLocations.includes(position)) {
            image.src = "images/lilly.jpg";
            score += 2;
        }
        else if (daisyLocations.includes(position)) {
            image.src = "images/daisy.jpg";
            score += 1;
        }

        updateDisplay();
    }
}

function showHelp() {
    let result = "warm";
    let row = Math.floor(lastLocation / 6);
    let col = lastLocation % 6;
    let nearby = [];

    for (let r = row - 1; r <= row + 1; r++) {
        for (let c = col - 1; c <= col + 1; c++) {
            if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                nearby.push(r * 6 + c);
            }
        }
    }

    if (nearby.includes(poisonLocation)) {
        result = "watch out";
    }
    else if (nearby.includes(roseLocation)) {
        result = "hot";
    }
    else if (nearby.some(p => lilyLocations.includes(p))) {
        result = "warm";
    }
    else {
        result = "cold";
    }

    document.getElementById("help").innerHTML =
        "Help report: " + result;
}

// BONUS: Move poison ivy N/E/S/W
function movePoisonIvy() {
    if (gameOver) return;

    let row = Math.floor(poisonLocation / 6);
    let col = poisonLocation % 6;
    let possibleMoves = [];

    if (row > 0) possibleMoves.push(poisonLocation - 6);
    if (row < 5) possibleMoves.push(poisonLocation + 6);
    if (col > 0) possibleMoves.push(poisonLocation - 1);
    if (col < 5) possibleMoves.push(poisonLocation + 1);

    // Avoid moving onto flower positions
    possibleMoves = possibleMoves.filter(p =>
        p !== roseLocation &&
        !lilyLocations.includes(p) &&
        !daisyLocations.includes(p)
    );

    if (possibleMoves.length === 0) return;

    let oldPosition = poisonLocation;
    let nextPosition = possibleMoves[
        Math.floor(Math.random() * possibleMoves.length)
    ];

    poisonLocation = nextPosition;

    // Update already revealed poison ivy
    if (visited.has(oldPosition)) {
        document.getElementById(ids[oldPosition]).src =
            "images/bush.jpg";
    }

    if (visited.has(nextPosition)) {
        document.getElementById(ids[nextPosition]).src =
            "images/poison.jpg";
    }

    // BONUS: Game over if ivy reaches player's square
    if (poisonLocation === lastLocation && locationsVisited > 0) {
        score -= 4;
        updateDisplay();
        document.getElementById(ids[poisonLocation]).src =
            "images/poison.jpg";
        endGame();
    }
}

// BONUS: Randomly swap two unvisited locations
function swapLocations() {
    if (gameOver) return;

    let available = Array.from({length: 36}, (_, i) => i)
        .filter(i => !visited.has(i));

    if (available.length < 2) return;

    let a = available[Math.floor(Math.random() * available.length)];
    available = available.filter(i => i !== a);
    let b = available[Math.floor(Math.random() * available.length)];

    function getType(position) {
        if (position === poisonLocation) return "poison";
        if (position === roseLocation) return "rose";
        if (lilyLocations.includes(position)) return "lily";
        if (daisyLocations.includes(position)) return "daisy";
        return "bush";
    }

    let typeA = getType(a);
    let typeB = getType(b);

    function setType(position, type) {
        if (type === "poison") poisonLocation = position;
        if (type === "rose") roseLocation = position;
        if (type === "lily") lilyLocations.push(position);
        if (type === "daisy") daisyLocations.push(position);
    }

    lilyLocations = lilyLocations.filter(p => p !== a && p !== b);
    daisyLocations = daisyLocations.filter(p => p !== a && p !== b);

    setType(a, typeB);
    setType(b, typeA);
}

// Move ivy every 3 seconds
setInterval(movePoisonIvy, 3000);

// Swap two hidden locations every 5 seconds
setInterval(swapLocations, 5000);
</script>

</html>

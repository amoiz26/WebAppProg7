
<!DOCTYPE html>

<head>

    <title>Flower Search Game</title>
    <style>

            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8f0;
        }

        h1 {
            color: darkgreen;
        }

        .game-info {
            margin: 15px;

        }


.game-board {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    margin: 20px auto;
}

.game-row {
    display: flex;
    gap: 5px;
}

.game-cell {
    width: 75px;
    height: 75px;
}

.game-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: 2px solid darkgreen;
    border-radius: 5px;
}


    </style>
</head>

    Click for help.
</p>

    </div>

</div>


<script>
    const ids = Array.from({length: 36}, (_, i) => "img" + i);

    let score = 0;
    let locationsVisited = 0;
    let lastLocation = 0;

    let poisonLocation = 19;
    let roseLocation = 14;
    let lilyLocations = [3, 25];
    let daisyLocations = [2, 5, 11, 20, 21];

    let gameOver = false;
    let visited = new Set();

    function check(position) {
        if (gameOver) {
            return;
        }

        let image = document.getElementById(ids[position]);

        if (!visited.has(position)) {
            visited.add(position);

            if (position === poisonLocation) {
                image.src = "images/poison.jpg";
                score -= 4;
                gameOver = true;
            }
            else if (position === roseLocation) {
                image.src = "images/rose.jpg";
                score += 4;
            }
            else if (lilyLocations.includes(position)) {
                image.src = "images/lilly.jpg";
                score += 2;
            }
            else if (daisyLocations.includes(position)) {
                image.src = "images/daisy.jpg";
                score += 1;
            }
        }

        locationsVisited++;
        lastLocation = position;

        document.getElementById("locations").innerHTML =
            "Number of locations checked is " + locationsVisited + ".";

        document.getElementById("score").innerHTML =
            "Score is " + score + ".";

        if (gameOver) {
            document.getElementById("help").innerHTML =
                "Game Over! You found poison ivy.";
        }
    }

    function showHelp() {
        let result = "warm";

        let row = Math.floor(lastLocation / 6);
        let col = lastLocation % 6;
        let nearby = [];

        for (let r = row - 1; r <= row + 1; r++) {
            for (let c = col - 1; c <= col + 1; c++) {
                if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                    nearby.push(r * 6 + c);
                }
            }
        }

        if (nearby.includes(poisonLocation)) {
            result = "watch out";
        }
        else if (nearby.includes(roseLocation)) {
            result = "hot";
        }
        else if (nearby.some(p => lilyLocations.includes(p))) {
            result = "warm";
        }
        else {
            result = "cold";
        }

        document.getElementById("help").innerHTML =
            "Help report: " + result;
    }
</script>

</html>
